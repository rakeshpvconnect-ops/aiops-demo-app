apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-demo-app
  namespace: default
  labels:
    app: aiops-demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiops-demo-app
  template:
    metadata:
      labels:
        app: aiops-demo-app
    spec:
      containers:
      - name: aiops-demo-app
        image: YOUR_DOCKERHUB_USERNAME/aiops-demo-app:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: '1.0.0'
        resources:
          requests:
            memory: '64Mi'
            cpu: '50m'
          limits:
            memory: '128Mi'
            cpu: '200m'
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
